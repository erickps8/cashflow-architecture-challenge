services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: cashflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: cashflow-postgres
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - cashflow_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: src/Auth/CashFlow.Auth.Api/Dockerfile
    container_name: cashflow-auth-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  launch-api:
    build:
      context: .
      dockerfile: src/Launch/1-Application/CashFlow.Launch.Api/Dockerfile
    container_name: cashflow-launch-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consolidation-api:
    build:
      context: .
      dockerfile: src/Consolidation/1-Application/CashFlow.Consolidation.Api/Dockerfile
    container_name: cashflow-consolidation-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      dockerfile: src/Worker/CashFlow.Worker/Dockerfile
    container_name: cashflow-worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  web:
    build:
      context: ./src/Web/cashflow-web
      dockerfile: Dockerfile
    container_name: cashflow-web
    ports:
      - "8080:80"
    depends_on:
      - launch-api
      - auth-api
    restart: unless-stopped

  homolog-seed:
    image: postgres:16
    container_name: cashflow-homolog-seed
    environment:
      PGPASSWORD: cashflow
    volumes:
      - ./docker/homologacao:/seed:ro
    command: ["sh", "-c", "sed 's/\\r$//' /seed/run-seed.sh > /tmp/run-seed.sh && sh /tmp/run-seed.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      launch-api:
        condition: service_started
    restart: "no"

volumes:
  cashflow_postgres_data:
