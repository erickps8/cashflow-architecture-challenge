name: Deploy Playground

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to deploy
        required: false
        default: feature/android-capacitor

concurrency:
  group: cashflow-playground
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: playground

    steps:
      - name: Check deployment configuration
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Playground deploy skipped: VPS_HOST, VPS_USER and VPS_SSH_KEY must be configured in the playground environment."
          fi

      - name: Deploy to plania.cloud
        if: steps.config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/cashflow/CashFlowChallenge
            BRANCH="${{ inputs.ref }}"
            echo "Deploying $BRANCH"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            docker compose up -d --build
            docker compose ps
