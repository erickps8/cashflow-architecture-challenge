name: Android Play Store

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-play-store-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CashFlowChallenge/src/Web/cashflow-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web bundle into Android
        run: npx cap sync android

      - name: Verify Android/web parity
        run: |
          test -d android/app/src/main/assets/public
          diff -qr dist android/app/src/main/assets/public

      - name: Apply CashFlow launcher branding
        run: node scripts/apply-android-branding.mjs

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/cashflow-release.jks

      - name: Configure release signing and version
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text()
          version_code = os.environ['VERSION_CODE']

          text = text.replace('versionCode 1', f'versionCode {version_code}', 1)
          text = text.replace(
              'android {',
              '''android {\n    signingConfigs {\n        release {\n            storeFile file("cashflow-release.jks")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }''',
              1,
          )
          text = text.replace(
              'buildTypes {\n        release {',
              'buildTypes {\n        release {\n            signingConfig signingConfigs.release',
              1,
          )
          path.write_text(text)
          PY

      - name: Build signed release AAB
        working-directory: CashFlowChallenge/src/Web/cashflow-web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-play-store-aab
          path: CashFlowChallenge/src/Web/cashflow-web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
