name: Android APK

on:
  push:
    branches:
      - feature/android-capacitor
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CashFlowChallenge/src/Web/cashflow-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: CashFlowChallenge/src/Web/cashflow-web/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-android-debug
          path: CashFlowChallenge/src/Web/cashflow-web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
